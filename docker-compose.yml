services:
  backend:
    build:
      context: ./stockpulse-ai/backend
      dockerfile: DockerFile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    restart: always

  frontend:
    build:
      context: ./stockpulse-ai/frontend
      dockerfile: DockerFile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

  worker:
    build:
      context: ./stockpulse-ai/backend
      dockerfile: DockerFile
    command: python -c "from workers.market_worker import run_market_worker; from workers.news_worker import run_news_worker; from workers.sentiment_worker import run_sentiment_worker_once; run_market_worker(); run_news_worker(); run_sentiment_worker_once()"
    env_file:
      - .env
    depends_on:
      - backend
    restart: on-failure